services:
  kong-database:
    image: postgres:13
    environment:
      POSTGRES_USER: ${POSTGRES_USER}
      POSTGRES_DB: ${POSTGRES_DB}
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD}
    volumes:
      - kong_data:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U kong -d kong"]
      interval: 5s
      timeout: 5s
      retries: 10
    networks:
      - kong-net

  kong-migration:
    image: kong:3.4
    command: sh -c "sleep 10 && kong migrations bootstrap"
    environment:
      - KONG_DATABASE=${KONG_DATABASE}
      - KONG_PG_HOST=${KONG_PG_HOST}
      - KONG_PG_USER=${KONG_PG_USER}
      - KONG_PG_PASSWORD=${KONG_PG_PASSWORD}
      - KONG_PG_DATABASE=${KONG_PG_DATABASE}
    depends_on:
      - kong-database
    restart: on-failure
    networks:
      - kong-net

  kong:
    image: kong:3.4
    ports:
      - "8000:8000"
      - "8443:8443"
      - "8001:8001"
      - "8444:8444"
    environment:
      - KONG_DATABASE=${KONG_DATABASE}
      - KONG_PG_HOST=${KONG_PG_HOST}
      - KONG_PG_USER=${KONG_PG_USER}
      - KONG_PG_PASSWORD=${KONG_PG_PASSWORD}
      - KONG_PG_DATABASE=${KONG_PG_DATABASE}
      - KONG_PROXY_ACCESS_LOG=${KONG_PROXY_ACCESS_LOG}
      - KONG_ADMIN_ACCESS_LOG=${KONG_ADMIN_ACCESS_LOG}
      - KONG_PROXY_ERROR_LOG=${KONG_PROXY_ERROR_LOG}
      - KONG_ADMIN_ERROR_LOG=${KONG_ADMIN_ERROR_LOG}
      - KONG_ADMIN_LISTEN=${KONG_ADMIN_LISTEN}
    depends_on:
      - kong-migration
    restart: on-failure
    healthcheck:
      test: ["CMD", "kong", "health"]
      interval: 10s
      timeout: 5s
      retries: 5
    networks:
      - kong-net
  
  kong-init:
    image: curlimages/curl:latest
    depends_on:
      - kong
    volumes:
      - ./kong/init-kong.sh:/init-kong.sh
    entrypoint: ["/bin/sh", "/init-kong.sh"]
    networks:
      - kong-net

  user-service:
    image: nginx:alpine
    ports:
      - "3001:80"
    volumes:
      - ./services/user-service/nginx.conf:/etc/nginx/nginx.conf
      - ./services/user-service/html:/usr/share/nginx/html
    healthcheck:
      test: ["CMD-SHELL", "wget -qO- http://localhost/health || exit 1"]
      interval: 10s
      timeout: 5s
      retries: 5
    networks:
      - kong-net

  product-service:
    image: nginx:alpine
    ports:
      - "3002:80"
    volumes:
      - ./services/product-service/nginx.conf:/etc/nginx/nginx.conf
      - ./services/product-service/html:/usr/share/nginx/html
    healthcheck:
      test: ["CMD-SHELL", "wget -qO- http://localhost/health || exit 1"]
      interval: 10s
      timeout: 5s
      retries: 5
    networks:
      - kong-net

  order-service:
    image: nginx:alpine
    ports:
      - "3003:80"
    volumes:
      - ./services/order-service/nginx.conf:/etc/nginx/nginx.conf
      - ./services/order-service/html:/usr/share/nginx/html
    healthcheck:
      test: ["CMD-SHELL", "wget -qO- http://localhost/health || exit 1"]
      interval: 10s
      timeout: 5s
      retries: 5
    networks:
      - kong-net

  redis:
    image: redis:alpine
    ports:
      - "6379:6379"

volumes:
  kong_data:
networks:
  kong-net:
